[tools]
go = "1.26.8"

[tasks.build]
description = "Build gauger-server into bin/"
run = 'go build -trimpath -ldflags "-X main.version=$(git rev-parse --short=12 HEAD)" -o bin/gauger-server ./cmd/gauger-server'

[tasks.test]
description = "Run the tests; set GAUGER_TEST_DATABASE_URL to include the Postgres ones"
run = "go test ./..."

[tasks.check]
description = "Generated code, formatting, vet and tests"
shell = "bash -c"
run = '''
set -eu
templ_sums() { git ls-files -co --exclude-standard -- '*_templ.go' | sort | xargs shasum; }
before=$(templ_sums)
go tool templ generate
if [ "$before" != "$(templ_sums)" ]; then
  echo "go tool templ generate changed generated files; commit them:" >&2
  git status --short -- '*_templ.go' >&2
  exit 1
fi
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "unformatted files:" >&2
  echo "$unformatted" >&2
  exit 1
fi
go vet ./...
go test ./...
'''

[tasks.dashboard]
description = "Serve /stats/ on 127.0.0.1 from GAUGER_DATABASE_URL; -seed fills an empty database"
run = "go run ./cmd/dashboard-dev"
