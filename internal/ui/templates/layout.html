<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}gauger{{end}}</title>
<style>
body { font: 14px/1.45 system-ui, sans-serif; margin: 0; color: #1f2328; }
header { background: #24292f; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: baseline; }
header a { color: #f0f6fc; margin-right: 18px; text-decoration: none; }
header a.brand { font-weight: 600; }
header .version { margin-left: auto; font: 12px ui-monospace, monospace; color: #adbac7; }
header .version a { color: inherit; margin-right: 0; }
main { padding: 16px 24px; max-width: 1200px; }
.error { background: #ffebe9; border: 1px solid #cf222e; padding: 6px 10px; margin: 8px 0; }
</style>
</head>
<body>
<header>
<a class="brand" href="/stats/">gauger</a>
<a href="/stats/">Dashboard</a>
<a href="/setup">Setup</a>
{{with version}}<span class="version" title="build {{.}}">{{with versionURL}}<a href="{{.}}">{{version}}</a>{{else}}{{version}}{{end}}</span>{{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
